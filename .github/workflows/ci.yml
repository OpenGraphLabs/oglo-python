name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Verify installed package
        run: python tools/check_installed.py
      - name: Test without hardware
        run: python -m pytest -o pythonpath=tests --import-mode=importlib

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install declared dependency floors
        run: python -m pip install . pytest numpy==1.24.0 pyserial==3.5 bleak==0.21.0
      - name: Verify installed package
        run: python tools/check_installed.py
      - name: Test without hardware
        run: python -m pytest -o pythonpath=tests --import-mode=importlib

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Check installed CLI
        run: |
          python tools/check_installed.py
          oglo --help
      - name: Verify source distribution
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          python tools/check_installed.py
          python -m pip install pytest
          python -m pytest -o pythonpath=tests --import-mode=importlib
