name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: sdk-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged release candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      artifact_id: ${{ steps.ci.outputs.artifact_id }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      prerelease: ${{ steps.artifact.outputs.prerelease }}
      sdist_name: ${{ steps.artifact.outputs.sdist_name }}
      sdist_sha256: ${{ steps.artifact.outputs.sdist_sha256 }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      wheel_name: ${{ steps.artifact.outputs.wheel_name }}
      wheel_sha256: ${{ steps.artifact.outputs.wheel_sha256 }}
    steps:
      - name: Check out the exact pushed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Set up policy Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify annotated tag, package version, and main ancestry
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag

          source_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$source_sha" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main

          python .github/scripts/release_policy.py validate-source \
            --project-file pyproject.toml \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$source_sha" \
            --tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"
      - name: Select a successful main CI artifact for the exact SHA
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          runs_json="$(gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$SOURCE_SHA" \
            -f per_page=100 \
            -f status=success)"

          selected_run=""
          selected_artifact=""
          while IFS=$'\t' read -r run_id run_attempt; do
            test -n "$run_id" || continue

            jobs_json="$(gh api --method GET \
              "repos/$REPOSITORY/actions/runs/$run_id/jobs" \
              -f filter=latest \
              -f per_page=100)"
            required_ok="$(jq '[.jobs[] | select(.name == "Required CI gate" and .conclusion == "success")] | length' <<<"$jobs_json")"
            provenance_ok="$(jq '[.jobs[] | select(.name == "Attest main-branch distributions" and .conclusion == "success")] | length' <<<"$jobs_json")"
            if [ "$required_ok" -ne 1 ] || [ "$provenance_ok" -ne 1 ]; then
              continue
            fi

            artifact_name="python-dist-$SOURCE_SHA-$run_attempt"
            artifacts_json="$(gh api --method GET \
              "repos/$REPOSITORY/actions/runs/$run_id/artifacts" \
              -f per_page=100)"
            artifact_matches="$(jq --arg name "$artifact_name" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              <<<"$artifacts_json")"
            if [ "$artifact_matches" -ne 1 ]; then
              continue
            fi

            selected_run="$run_id"
            selected_artifact="$(jq -r --arg name "$artifact_name" \
              '.artifacts[] | select(.name == $name and .expired == false) | .id' \
              <<<"$artifacts_json")"
            break
          done < <(jq -r --arg sha "$SOURCE_SHA" '
            .workflow_runs[]
            | select(
                .head_sha == $sha
                and .head_branch == "main"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success"
              )
            | [.id, .run_attempt]
            | @tsv
          ' <<<"$runs_json")

          test -n "$selected_run"
          test -n "$selected_artifact"
          echo "ci_run_id=$selected_run" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$selected_artifact" >> "$GITHUB_OUTPUT"
      - name: Download the selected immutable CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.ci_run_id }}
      - name: Verify package metadata, manifest, and byte hashes
        id: artifact
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          python .github/scripts/release_policy.py verify-dist \
            --dist dist \
            --project-file pyproject.toml \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --tag "$RELEASE_TAG" \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify GitHub build provenance for the exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$REPOSITORY" \
              --deny-self-hosted-runners \
              --signer-digest "$SOURCE_SHA" \
              --signer-workflow "$REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref refs/heads/main
          done

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: sdk-github-release
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Download the exact verified CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify.outputs.ci_run_id }}
      - name: Reconcile tag and verified artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SDIST_NAME: ${{ needs.verify.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.verify.outputs.sdist_sha256 }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          WHEEL_NAME: ${{ needs.verify.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.verify.outputs.wheel_sha256 }}
        run: |
          case "$WHEEL_NAME" in
            *[!A-Za-z0-9._+-]*) exit 1 ;;
          esac
          case "$WHEEL_NAME" in
            *.whl) ;;
            *) exit 1 ;;
          esac
          case "$SDIST_NAME" in
            *[!A-Za-z0-9._+-]*) exit 1 ;;
          esac
          case "$SDIST_NAME" in
            *.tar.gz) ;;
            *) exit 1 ;;
          esac
          test -f "dist/$WHEEL_NAME"
          test -f "dist/$SDIST_NAME"
          test -f dist/release-manifest.json
          test "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find dist -mindepth 1 -maxdepth 1 -type l | wc -l | tr -d ' ')" = 0
          test "$(sha256sum "dist/$WHEEL_NAME" | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum "dist/$SDIST_NAME" | cut -d' ' -f1)" = "$SDIST_SHA256"

          ref_json="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          for _ in 1 2 3 4; do
            if [ "$object_type" = commit ]; then
              break
            fi
            test "$object_type" = tag
            tag_json="$(gh api "repos/$REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
          done
          test "$object_type" = commit
          test "$object_sha" = "$SOURCE_SHA"

          for artifact in "dist/$WHEEL_NAME" "dist/$SDIST_NAME"; do
            gh attestation verify "$artifact" \
              --repo "$REPOSITORY" \
              --deny-self-hosted-runners \
              --signer-digest "$SOURCE_SHA" \
              --signer-workflow "$REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$SOURCE_SHA" \
              --source-ref refs/heads/main
          done

          printf '%s  %s\n%s  %s\n' \
            "$WHEEL_SHA256" "$WHEEL_NAME" \
            "$SDIST_SHA256" "$SDIST_NAME" \
            > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Create or reconcile immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SDIST_SHA256: ${{ needs.verify.outputs.sdist_sha256 }}
          SDIST_NAME: ${{ needs.verify.outputs.sdist_name }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          WHEEL_SHA256: ${{ needs.verify.outputs.wheel_sha256 }}
          WHEEL_NAME: ${{ needs.verify.outputs.wheel_name }}
        run: |
          set -euo pipefail
          title="OGLO Python SDK $VERSION"
          expected_assets="$(printf '%s\n' "$WHEEL_NAME" "$SDIST_NAME" SHA256SUMS | sort)"

          verify_release_metadata() {
            local release_json="$1"
            local allow_partial="$2"
            jq -e \
              --arg source_sha "$SOURCE_SHA" \
              --arg tag "$TAG" \
              --arg title "$title" \
              --argjson prerelease "$PRERELEASE" \
              '.tag_name == $tag and
               .target_commitish == $source_sha and
               .name == $title and
               .prerelease == $prerelease' \
              "$release_json" >/dev/null

            local observed_assets
            observed_assets="$(jq -r '.assets[].name' "$release_json" | sort)"
            if [ "$allow_partial" = true ]; then
              comm -13 \
                <(printf '%s\n' "$expected_assets") \
                <(printf '%s\n' "$observed_assets") |
                test "$(cat)" = ""
            else
              test "$observed_assets" = "$expected_assets"
            fi
            test "$(jq '[.assets[].name] | length' "$release_json")" = \
              "$(jq '[.assets[].name] | unique | length' "$release_json")"
          }

          download_and_verify_asset() {
            local release_json="$1"
            local name="$2"
            local expected_sha="$3"
            local asset_id
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' "$release_json")"
            test "$asset_id" != ""
            gh api \
              --header 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$RUNNER_TEMP/release-$name"
            test "$(sha256sum "$RUNNER_TEMP/release-$name" | cut -d' ' -f1)" = "$expected_sha"
          }

          sums_sha256="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          release_json="$RUNNER_TEMP/sdk-release.json"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$release_json" 2>/dev/null; then
            # A failed prior upload may leave a draft behind. Existing bytes
            # are immutable: verify them, add only missing assets to that
            # draft, and never overwrite a mismatched file.
            is_draft="$(jq -r .draft "$release_json")"
            verify_release_metadata "$release_json" "$is_draft"
          else
            release_args=(
              --repo "$GITHUB_REPOSITORY"
              --verify-tag
              --target "$SOURCE_SHA"
              --title "$title"
              --notes-from-tag
              --draft
            )
            if [ "$PRERELEASE" = true ]; then
              release_args+=(--prerelease)
            fi
            gh release create "$TAG" "${release_args[@]}"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$release_json"
            is_draft=true
            verify_release_metadata "$release_json" true
          fi

          while IFS=$'\t' read -r name path expected_sha; do
            if jq -e --arg name "$name" '.assets[] | select(.name == $name)' "$release_json" >/dev/null; then
              download_and_verify_asset "$release_json" "$name" "$expected_sha"
            else
              test "$is_draft" = true
              gh release upload "$TAG" "$path" --repo "$GITHUB_REPOSITORY"
            fi
          done <<EOF
          $WHEEL_NAME	dist/$WHEEL_NAME	$WHEEL_SHA256
          $SDIST_NAME	dist/$SDIST_NAME	$SDIST_SHA256
          SHA256SUMS	dist/SHA256SUMS	$sums_sha256
          EOF

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$release_json"
          verify_release_metadata "$release_json" false
          download_and_verify_asset "$release_json" "$WHEEL_NAME" "$WHEEL_SHA256"
          download_and_verify_asset "$release_json" "$SDIST_NAME" "$SDIST_SHA256"
          download_and_verify_asset "$release_json" SHA256SUMS "$sums_sha256"

          if [ "$(jq -r .draft "$release_json")" = true ]; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --verify-tag
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$release_json"
          fi
          test "$(jq -r .draft "$release_json")" = false
          verify_release_metadata "$release_json" false
